<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SVG Test</title>
</head>
<body>

<h2>Teste de SVG</h2>

<svg xmlns="http://www.w3.org/2000/svg"
     width="500"
     height="300"
     viewBox="0 0 500 300">

    <rect width="500" height="300" fill="#1e293b" rx="15"/>

    <circle cx="100" cy="100" r="50" fill="#38bdf8"/>

    <rect x="200" y="50" width="200" height="100"
          rx="10" fill="#22c55e"/>

    <text x="250" y="220"
          font-size="24"
          text-anchor="middle"
          fill="white">
        poc tested!
    </text>

</svg>

</body>
</html>
